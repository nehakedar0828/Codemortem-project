<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CodeMortem Login</title>

    <link rel="stylesheet"
          href="css/style.css">
</head>

<body>

<div class="container">

    <h1>CodeMortem</h1>

    <form id="loginForm">

        <div class="input-group">
            <label>Email</label>

            <input type="email"
                   id="email"
                   required>
        </div>

        <div class="input-group">
            <label>Password</label>

            <input type="password"
                   id="password"
                   required>
        </div>

        <button type="submit">
            Login
        </button>

    </form>

    <div class="link">
        <a href="register.html">
            Create Account
        </a>
    </div>

</div>

<script src="js/auth.js"></script>

</body>
</html>
