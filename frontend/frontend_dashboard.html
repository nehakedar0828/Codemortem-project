<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CodeMortem Dashboard</title>

    <link rel="stylesheet"
          href="css/style.css">

    <style>

        body{
            display:block;
            padding:30px;
        }

        .navbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:30px;
            color:white;
        }

        .navbar button{
            width:auto;
            padding:10px 20px;
        }

        .dashboard-header{
            color:white;
            margin-bottom:25px;
        }

        .incident-grid{
            display:grid;
            grid-template-columns:
                repeat(auto-fit,minmax(300px,1fr));

            gap:20px;
        }

        .incident-card{
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(10px);
            border-radius:15px;
            padding:20px;
            color:white;
            box-shadow:0 8px 32px rgba(0,0,0,0.3);
        }

        .incident-card h3{
            margin-bottom:10px;
            transition:0.3s;
            cursor:pointer;
        }

        .incident-card:hover{
            transform:translateY(-5px);
        }

        .severity{
            display:inline-block;
            padding:6px 12px;
            border-radius:20px;
            font-size:14px;
            margin-top:10px;
        }

        .HIGH{
            background:#ff4d4d;
        }

        .MEDIUM{
            background:#ffb84d;
        }

        .LOW{
            background:#4dff88;
            color:black;
        }

    </style>

</head>

<body>

<div class="navbar">

    <h1>CodeMortem Dashboard 🚀</h1>

    <button onclick="logout()">
        Logout
    </button>

</div>

<div class="dashboard-header">

    <h2>Your Incidents</h2>
    <br>

    <input
            type="text"

            id="searchInput"

            placeholder="Search incidents..."

            style="
        width:300px;
        padding:12px;
        border:none;
        border-radius:10px;
        outline:none;
    "

            onkeyup="searchIncidents()"
    />
    <br>

    <button onclick="goToCreatePage()">
        + Create Incident
    </button>


</div>

<div class="incident-grid"
     id="incidentGrid">

</div>

<script src="js/dashboard.js"></script>

</body>
</html>
